<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Escolha um modelo e crie etiquetas D&D.">
  <title>Gerador de Etiquetas D&D</title>
  <style>
    :root{font-family:Inter,Arial,sans-serif;color:#20302f;background:#f5f8f8}
    *{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
    button,input{font:inherit}button{cursor:pointer}
    #home{height:100%;overflow-y:auto;padding:0 34px 52px;background:#f5f8f8}
    .topbar{height:82px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e1e9e8;max-width:1420px;margin:auto}
    .brand{display:flex;align-items:center;gap:13px;font-size:18px;font-weight:800;letter-spacing:-.4px}
    .brand-icon{width:42px;height:42px;border-radius:13px;background:#006b67;color:white;display:grid;place-items:center;font-size:21px}
    .topnote{font-size:13px;color:#728381}.intro{max-width:1420px;margin:42px auto 28px}
    .eyebrow{font-size:11px;font-weight:800;letter-spacing:1.7px;color:#007a73;text-transform:uppercase}
    h1{font-size:clamp(27px,3.4vw,40px);margin:10px 0 10px;letter-spacing:-1.3px}
    .subtitle{font-size:15px;color:#697b78;margin:0;line-height:1.6}
    .toolbar{max-width:1420px;margin:0 auto 22px;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
    .toolbar strong{font-size:14px}.toolbar input{background:#fff;border:1px solid #dce6e5;border-radius:13px;padding:13px 16px;outline:none;width:min(320px,100%);color:#20302f}
    .toolbar input:focus{border-color:#006b67;box-shadow:0 0 0 3px #d6eeeb}
    .gallery{max-width:1420px;margin:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
    .model{background:#fff;border:1px solid #e3ebe9;border-radius:20px;text-align:left;padding:12px;transition:transform .2s,border-color .2s,box-shadow .2s;box-shadow:0 4px 15px rgba(23,60,55,.025);min-width:0}
    .model:hover,.model:focus-visible{transform:translateY(-4px);border-color:#63ada4;box-shadow:0 15px 35px rgba(0,78,70,.12);outline:none}
    .model-new{position:relative;border-color:#d8b45b;animation:new-card-glow 3.2s ease-in-out infinite}
    .new-badge{position:absolute;top:22px;right:22px;z-index:1;padding:7px 13px;border:1px solid #e8cc80;border-radius:999px;background:linear-gradient(135deg,#f9e7ab,#d4a63a 55%,#f2d684);color:#513a08;font-size:11px;font-weight:900;letter-spacing:1.2px;box-shadow:0 3px 10px #80601e30;pointer-events:none}
    @keyframes new-card-glow{0%,100%{box-shadow:0 4px 15px #b88a2512}50%{box-shadow:0 6px 25px #c99b3b45;border-color:#c69a35}}
    .model-new:hover,.model-new:focus-visible{animation:none}
    @media(prefers-reduced-motion:reduce){.model-new{animation:none}}
    .art{height:164px;background:var(--tint,#eff7f6);border-radius:13px;display:grid;place-items:center;overflow:hidden;position:relative}
    .art img{width:62%;height:76%;object-fit:contain;filter:drop-shadow(0 9px 9px #0002)}
    .art .fallback{font-size:40px;font-weight:900;color:var(--accent,#006b67);border:4px solid currentColor;border-radius:10px;padding:13px 22px;transform:rotate(-5deg)}
    .meta{padding:17px 7px 8px;display:flex;gap:8px;align-items:center;justify-content:space-between}
    .model-name{font-size:15px;font-weight:800;line-height:1.35}.model-sub{font-size:12px;color:#83928f;margin-top:5px}
    .arrow{border-radius:50%;height:31px;width:31px;background:#e7f6f3;color:#006b67;display:grid;place-items:center;flex:none;font-weight:800}
    #workspace{display:none;height:100%;background:white}body.editing #home{display:none}body.editing #workspace{display:block}
    .workspace-head{height:59px;display:flex;align-items:center;gap:18px;padding:0 18px;border-bottom:1px solid #dfe9e7;background:#fff}
    .back{background:#eef7f5;border:1px solid #d2e9e5;color:#006b67;border-radius:10px;font-weight:750;padding:9px 13px}
    #current-title{font-weight:800;font-size:14px}#app-frame{width:100%;height:calc(100% - 59px);border:0;display:block}
    #empty{display:none;max-width:1420px;margin:30px auto;color:#6d7b78}
    @media(max-width:1000px){.gallery{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:720px){#home{padding:0 16px 35px}.topbar{height:68px}.topnote{display:none}.intro{margin:30px auto 24px}.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.model{padding:8px;border-radius:15px}.art{height:125px}.model-name{font-size:13px}.model-sub{font-size:11px}.meta{padding:12px 3px 5px}.arrow{width:27px;height:27px}}
    @media(max-width:420px){.art{height:105px}.art img{width:76%}.gallery{gap:9px}.model-sub{display:none}}
    @media print{.workspace-head{display:none}#app-frame{height:100%}}
  </style>
</head>
<body>
  <main id="home">
    <header class="topbar"><div class="brand"><span class="brand-icon">D&amp;D</span>Gerador de Etiquetas</div><span class="topnote">Central de modelos de impressão</span></header>
    <section class="intro"><div class="eyebrow">Biblioteca de modelos</div><h1>Qual etiqueta vamos criar?</h1><p class="subtitle">Escolha um modelo para abrir seu espaço de edição, configurar os produtos e preparar a impressão.</p></section>
    <div class="toolbar"><strong id="count">Modelos disponíveis</strong><input id="search" type="search" placeholder="Buscar modelo de etiqueta..." aria-label="Buscar modelo"></div>
    <section class="gallery" id="gallery" aria-label="Modelos de etiquetas"></section>
    <p id="empty">Nenhum modelo encontrado para esta busca.</p>
  </main>
  <section id="workspace" aria-label="Editor de etiquetas">
    <div class="workspace-head"><button class="back" id="back" type="button">← Todos os modelos</button><span id="current-title"></span></div>
    <iframe id="app-frame" src="./legacy.html" title="Editor de Etiquetas D&D"></iframe>
  </section>
  <script>
    (() => {
      const models = [
        {name:'Placa de Acrílico',image:'assets/precificador/fundo-verde.png',tint:'#e9f6ee'},
        {name:'Placa acrilico 4,8 x 3 cm',image:'assets/precificador/fundo-verde.png',tint:'#e9f6ee',src:'./placa-acrilico-48x30.html',isNew:true},
        {name:'Placa de Acrílico Promoção',image:'assets/precificador/fundo-verde2.png',tint:'#e4f6f1'},
        {name:'Régua de Preços',image:'assets/precificador/fundo-verde.png',tint:'#eaf4f5'},
        {name:'Régua de Preço Promoção',image:'assets/precificador/fundo-rosa.png',tint:'#fff0f5'},
        {name:'Etiqueta Vitrine',image:'assets/placa/nuvem-rosa.png',tint:'#fff0f4'},
        {name:'Expositor Madeira',image:'assets/precario/template.png',tint:'#f7f1e8'},
        {name:'Cartões vendedoras',image:'assets/vendedoras/verde.svg',tint:'#e7f6f1'},
        {name:'Preçario Black Friday',tint:'#ffe9ee',accent:'#bc2d56'},
        {name:'A5 Black Friday',image:'assets/black-friday-a5/template.webp',tint:'#f8e9ed'},
        {name:'A5 Black Friday (A6)',image:'assets/black-friday-a5/template.webp',tint:'#faeaf0'}
      ];
      const frame = document.getElementById('app-frame');
      const gallery = document.getElementById('gallery');
      const input = document.getElementById('search');
      let active = null;
      let loaded = false;
      function prepareFrame() {
        const doc = frame.contentDocument;
        if (!doc) return;
        if (!doc.getElementById('dd-gallery-hide-rail')) {
          const style = doc.createElement('style');
          style.id='dd-gallery-hide-rail';
          style.textContent='.model-rail{display:none!important}';
          doc.head.appendChild(style);
        }
        if (!doc.getElementById('dd-whatsapp-loader')) {
          const script=doc.createElement('script');script.id='dd-whatsapp-loader';
          script.src='./cartao-agradecimento.js?v=20261102-ordem';script.defer=true;doc.body.appendChild(script);
        }
      }
      function activate(model) {
        active=model;
        const source=model.src||'./legacy.html';
        if(frame.getAttribute('src')!==source) frame.setAttribute('src',source);
        document.getElementById('current-title').textContent=model.name;
        document.body.classList.add('editing');
        const attempt = (n=0) => {
          try {
            const doc=frame.contentDocument;
            const buttons=Array.from(doc?.querySelectorAll('.model-rail .model-item')||[]);
            const selected=buttons.find(b=>b.getAttribute('aria-label')===model.name);
            if(selected){selected.click();return;}
          } catch(e){console.warn('Erro ao selecionar modelo',e)}
          if(n<35) setTimeout(()=>attempt(n+1),120);
        };
        attempt();
      }
      function draw(){
        const q=input.value.trim().toLocaleLowerCase('pt-BR');
        const visible=models.filter(m=>m.name.toLocaleLowerCase('pt-BR').includes(q));
        document.getElementById('count').textContent=visible.length+' modelos disponíveis';
        document.getElementById('empty').style.display=visible.length?'none':'block';
        gallery.replaceChildren();
        visible.forEach(model=>{
          const button=document.createElement('button');button.className='model';button.type='button';
          if(model.isNew){button.classList.add('model-new');const badge=document.createElement('span');badge.className='new-badge';badge.textContent='NOVO';button.appendChild(badge);}
          const art=document.createElement('div');art.className='art';art.style.setProperty('--tint',model.tint);
          if(model.image){
            const img=document.createElement('img');img.src=model.image;img.alt='';img.loading='lazy';
            img.onerror=()=>{img.remove();art.textContent='D&D';art.style.fontWeight='900';art.style.color='#006b67';art.style.fontSize='34px'};
            art.appendChild(img);
          }else{const fb=document.createElement('div');fb.className='fallback';fb.textContent='SALE';fb.style.setProperty('--accent',model.accent||'#006b67');art.appendChild(fb)}
          const meta=document.createElement('div');meta.className='meta';
          const labels=document.createElement('div');const name=document.createElement('div');name.className='model-name';name.textContent=model.name;
          const sub=document.createElement('div');sub.className='model-sub';sub.textContent='Abrir editor de etiqueta';labels.append(name,sub);
          const arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='→';meta.append(labels,arrow);
          button.append(art,meta);button.addEventListener('click',()=>activate(model));gallery.appendChild(button);
        });
      }
      document.getElementById('back').addEventListener('click',()=>{document.body.classList.remove('editing');active=null;});
      input.addEventListener('input',draw);
      frame.addEventListener('load',()=>{loaded=true;prepareFrame();if(active)activate(active)});
      draw();
    })();
  </script>
</body>
</html>
