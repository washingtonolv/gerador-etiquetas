<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Crie, visualize e imprima etiquetas e materiais D&D.">
  <title>Gerador de Etiquetas D&D</title>
</head>
<body>
  <noscript>Ative o JavaScript para usar o Gerador de Etiquetas D&amp;D.</noscript>
  <script>
    (async () => {
      try {
        const response = await fetch("./legacy.html", { cache: "no-cache" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        let html = await response.text();
        html = html.replace("</body>", '<script src="./cartao-agradecimento.js"><\/script></body>');
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.body.innerHTML = '<main style="font:16px Arial,sans-serif;padding:32px"><h1>Gerador de Etiquetas D&amp;D</h1><p>Não foi possível carregar o aplicativo.</p><button onclick="location.reload()">Tentar novamente</button></main>';
        console.error("[gerador-etiquetas] Falha ao carregar legacy.html", error);
      }
    })();
  </script>
</body>
</html>
